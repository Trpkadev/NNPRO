services:
  caddy:
    extends:
      file: docker-compose.base.yaml
      service: caddy
    environment:
      DOMAIN: localhost
      ACME_EMAIL: local@localhost
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  frontend:
    extends:
      file: docker-compose.base.yaml
      service: frontend

  backend:
    extends:
      file: docker-compose.base.yaml
      service: backend
    build:
      target: development
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    extends:
      file: docker-compose.base.yaml
      service: db
    ports:
      - "3306:3306"

  redis:
    extends:
      file: docker-compose.base.yaml
      service: redis
    ports:
      - "127.0.0.1:6379:6379"

networks:
  app_net:
    driver: bridge

volumes:
  mariadb_data:
  redis_data:
  dp_keys:
  caddy_data:
  caddy_config: